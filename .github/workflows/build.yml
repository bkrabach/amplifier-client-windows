name: Windows client
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: dotnet run --project tests/Amplifier.Core.Tests -c Release
  windows:
    name: Windows build and rendering
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/prepare-artwork.py
      - run: dotnet run --project tests/Amplifier.Core.Tests -c Release
      - run: dotnet publish src/Amplifier.Windows/Amplifier.Windows.csproj -c Release -r win-x64 --self-contained true -o .artifacts/preview-win-x64
      - name: Native rendering and user-protected credential checks
        shell: pwsh
        run: |
          $process = Start-Process .artifacts/preview-win-x64/Amplifier.exe -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Native checks timed out' }
          if ($process.ExitCode -ne 0) { Get-Content "$env:LOCALAPPDATA/Microsoft/Amplifier for Windows Preview/native-checks/failure.txt"; throw 'Native checks failed' }
          $receipt = "$env:LOCALAPPDATA/Microsoft/Amplifier for Windows Preview/native-checks/result.json"
          Copy-Item $receipt .artifacts/native-checks.json
          Get-Content $receipt
      - name: Package unsigned development build
        shell: pwsh
        run: Compress-Archive -Path .artifacts/preview-win-x64/* -DestinationPath .artifacts/amplifier-windows-preview-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-windows-preview-x64
          path: |
            .artifacts/amplifier-windows-preview-x64.zip
            .artifacts/native-checks.json
          retention-days: 7
          if-no-files-found: error
